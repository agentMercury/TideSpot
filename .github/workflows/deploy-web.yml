name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      # E2E 跑的是 preview 服务：必须用根 base 构建，否则 /<repo>/ 前缀会让资源 404
      - name: Build (E2E, root base)
        run: npm run build

      - name: Budget
        run: npm run check:budget

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 显式启动 preview 服务：CI 下 Playwright 的 webServer 未能拉起（ERR_CONNECTION_REFUSED），
      # 改为在 job 里手动起服务并等它就绪，避免依赖 webServer 生命周期。
      - name: Start preview server
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              echo "preview ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "preview failed to start" >&2
          exit 1

      - name: E2E
        # PLAYWRIGHT_BASE_URL 已由 config 固定为 127.0.0.1:4173；reuseExistingServer 复用上面起的服务
        run: npm run test:e2e

      # 发布前按仓库名重建：https://<user>.github.io/<repo>/
      - name: Build (Pages base)
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4