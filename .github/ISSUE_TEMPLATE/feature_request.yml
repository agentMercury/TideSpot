name: ✨ 功能需求
description: 提出一个新功能或改进建议
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 你遇到什么问题？为什么需要这个功能
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的功能
      description: 描述你希望它怎么工作
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案建议
      description: 可选，你有想法的话
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 高（阻塞使用）
        - 中（影响体验）
        - 低（锦上添花）
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 附加信息
    validations:
      required: false
