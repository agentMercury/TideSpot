<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>潮点 TideSpot · UI 风格探索总览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0D1114; color: #E8EFEA; font-family: "Microsoft YaHei", sans-serif; padding: 24px 26px 26px; }
  h1 { font-family: "KaiTi", serif; font-size: 22px; font-weight: 400; letter-spacing: 2px; }
  h1 small { font-family: Georgia, serif; font-size: 9px; letter-spacing: 3px; opacity: .5; margin-left: 8px; }
  .row { display: flex; gap: 18px; margin-top: 14px; }
  .group { display: flex; flex-direction: column; }
  .glabel { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .glabel b { font-family: "KaiTi", serif; font-size: 14px; font-weight: 400; letter-spacing: 1px; }
  .glabel span { font-size: 8px; letter-spacing: 1.6px; opacity: .45; }
  .pair { display: flex; gap: 10px; }
  figure { width: 208px; }
  figure img { width: 208px; display: block; border: 1px solid #ffffff14; }
  figcaption { font-size: 8.5px; letter-spacing: 1px; opacity: .6; margin-top: 5px; text-align: center; }
</style>
</head>
<body>
  <h1>潮点 TideSpot · 详情页风格探索<small>DETAIL SCREEN · 3 DIRECTIONS × 2 WATER TYPES</small></h1>
  <div class="row">
    <div class="group">
      <div class="glabel"><b>V1 鱼印丝网</b><span>SILKSCREEN ICHTHYS</span></div>
      <div class="pair">
        <figure><img src="v1-fishprint/v1-inland.png"><figcaption>内陆湖泊 · INLAND</figcaption></figure>
        <figure><img src="v1-fishprint/v1-ocean.png"><figcaption>近海礁区 · NEARSHORE</figcaption></figure>
      </div>
    </div>
    <div class="group">
      <div class="glabel"><b>V2 野外徽章</b><span>GREAT OUTDOORS BADGE</span></div>
      <div class="pair">
        <figure><img src="v2-badge/v2-inland.png"><figcaption>内陆湖泊 · INLAND</figcaption></figure>
        <figure><img src="v2-badge/v2-ocean.png"><figcaption>近海礁区 · NEARSHORE</figcaption></figure>
      </div>
    </div>
    <div class="group">
      <div class="glabel"><b>V3 路亚图鉴</b><span>LURE FIELD GUIDE</span></div>
      <div class="pair">
        <figure><img src="v3-fieldguide/v3-inland.png"><figcaption>内陆湖泊 · INLAND</figcaption></figure>
        <figure><img src="v3-fieldguide/v3-ocean.png"><figcaption>近海礁区 · NEARSHORE</figcaption></figure>
      </div>
    </div>
  </div>
</body>
</html>
