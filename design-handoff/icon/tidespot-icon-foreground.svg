<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108" role="img" aria-label="TideSpot adaptive icon foreground: crosshair and tide lines">
  <title>TideSpot · adaptive icon foreground layer (108 dp, 72 dp safe zone 18..90)</title>
  <!-- 准星环 + 四向刻度：F-1.3「准星是唯一选点真源」 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <circle cx="54" cy="48" r="22"/>
    <path d="M54 20 v6 M54 70 v6 M26 48 h6 M76 48 h6"/>
  </g>
  <!-- 中心薄荷点：当前钓点 -->
  <circle cx="54" cy="48" r="5.5" fill="#80CBC4"/>
  <!-- 双潮线：潮汐 / 水位；小尺寸下作为辅助元素 -->
  <g fill="none" stroke="#80CBC4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 80 Q31 73 42 80 T64 80 T88 80"/>
    <path d="M20 87 Q31 80 42 87 T64 87 T88 87"/>
  </g>
</svg>
